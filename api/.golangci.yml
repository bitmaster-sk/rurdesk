version: "2"

# Pinned to v2.12.2 on purpose: it is the last release whose go.mod requires
# Go 1.25, so `go install` works under GOTOOLCHAIN=local. v2.13+ needs Go 1.26.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unconvert
    - unused

  settings:
    revive:
      confidence: 0.8
      # `exported`, `package-comments` and `var-naming` stay off. The first two
      # mandate doc comments the project deliberately does not write; the third
      # wants IDProject over IdProject, which would break the db/json tag mapping
      # and the id-prefix naming convention used across the whole codebase.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: time-naming
        - name: unexported-return
        - name: unused-parameter
        - name: var-declaration

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers decode fixtures and seed rows through the pool constantly;
      # a failure there fails the assertion that follows it anyway.
      - path: _test.go
        linters:
          - errcheck
