<div class="flex justify-center p-4">
    <form
        [formGroup]="form"
        (ngSubmit)="onSave()"
        class="panel shrink-0 w-full"
        style="max-width: 480px"
    >
        <header class="panel-head" [uiSaveStatus]="saveStatus()">
            <div class="panel-head-l">
                <tabler-icon icon="settings" [size]="16" class="panel-icon" />
                <div class="panel-title">{{ 'ADMIN.SETTINGS' | translate }}</div>
            </div>
        </header>
        <div class="panel-body flex flex-col gap-4">
            <div class="flex flex-col gap-1">
                <label for="tablePageSize">{{ 'SETTINGS.TABLE_PAGE_SIZE' | translate }}</label>
                <input id="tablePageSize" uiInput type="number" formControlName="tablePageSize" />
            </div>
            <div class="flex flex-col gap-1">
                <label for="kanbanPageSize">{{ 'SETTINGS.KANBAN_PAGE_SIZE' | translate }}</label>
                <input id="kanbanPageSize" uiInput type="number" formControlName="kanbanPageSize" />
            </div>
            <div class="flex flex-col gap-1">
                <label for="ganttBacklogPageSize">
                    {{ 'SETTINGS.GANTT_BACKLOG_PAGE_SIZE' | translate }}
                </label>
                <input
                    id="ganttBacklogPageSize"
                    uiInput
                    type="number"
                    formControlName="ganttBacklogPageSize"
                />
            </div>
            <div class="flex flex-col gap-1">
                <label for="sprintVelocityLimit">
                    {{ 'SETTINGS.SPRINT_VELOCITY_LIMIT' | translate }}
                </label>
                <input
                    id="sprintVelocityLimit"
                    uiInput
                    type="number"
                    formControlName="sprintVelocityLimit"
                />
            </div>
            <div class="flex flex-col gap-1">
                <label for="userApiKeyLimit">
                    {{ 'SETTINGS.USER_API_KEY_LIMIT' | translate }}
                </label>
                <input
                    id="userApiKeyLimit"
                    uiInput
                    type="number"
                    formControlName="userApiKeyLimit"
                    data-testid="settings-user-token-limit"
                />
            </div>
            <div class="flex items-center justify-between gap-2">
                <label for="isAgentThinkingPersisted">
                    {{ 'SETTINGS.IS_AGENT_THINKING_PERSISTED' | translate }}
                </label>
                <input
                    id="isAgentThinkingPersisted"
                    type="checkbox"
                    uiToggle
                    formControlName="isAgentThinkingPersisted"
                    data-testid="settings-agent-thinking-persistence"
                />
            </div>
            <div class="flex flex-col gap-1">
                <label for="agentThinkingMaxKb">
                    {{ 'SETTINGS.AGENT_THINKING_MAX_KB' | translate }}
                </label>
                <input
                    id="agentThinkingMaxKb"
                    uiInput
                    type="number"
                    formControlName="agentThinkingMaxKb"
                    data-testid="settings-agent-thinking-max-kb"
                />
            </div>
        </div>
        @if (versionLabel()) {
            <footer class="panel-body flex items-center justify-between pt-0">
                <span class="ui-color-text-muted">{{ 'ADMIN.VERSION' | translate }}</span>
                <span class="ui-color-text-muted font-mono">{{ versionLabel() }}</span>
            </footer>
        }
    </form>
</div>
