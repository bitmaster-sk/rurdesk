<form
    [formGroup]="form"
    (ngSubmit)="onSave()"
    class="panel shrink-0 w-full"
    style="max-width: 480px"
    data-testid="settings-agents"
>
    <header class="panel-head" [uiSaveStatus]="saveStatus()">
        <div class="panel-head-l">
            <tabler-icon icon="sparkles" [size]="16" class="panel-icon" />
            <div class="panel-title">{{ 'ADMIN.SETTINGS_NAV.AGENTS' | translate }}</div>
        </div>
    </header>
    <div class="panel-body flex flex-col gap-4">
        <div class="flex flex-col gap-1">
            <label for="userApiKeyLimit">
                {{ 'SETTINGS.USER_API_KEY_LIMIT' | translate }}
            </label>
            <input
                id="userApiKeyLimit"
                uiInput
                type="number"
                formControlName="userApiKeyLimit"
                data-testid="settings-user-token-limit"
            />
        </div>
        <div class="flex items-center justify-between gap-2">
            <label for="isAgentThinkingPersisted">
                {{ 'SETTINGS.IS_AGENT_THINKING_PERSISTED' | translate }}
            </label>
            <input
                id="isAgentThinkingPersisted"
                type="checkbox"
                uiToggle
                formControlName="isAgentThinkingPersisted"
                data-testid="settings-agent-thinking-persistence"
            />
        </div>
        <div class="flex flex-col gap-1">
            <label for="agentThinkingMaxKb">
                {{ 'SETTINGS.AGENT_THINKING_MAX_KB' | translate }}
            </label>
            <input
                id="agentThinkingMaxKb"
                uiInput
                type="number"
                formControlName="agentThinkingMaxKb"
                data-testid="settings-agent-thinking-max-kb"
            />
        </div>
        <app-agent-run-defaults-fields
            idPrefix="settings"
            groupName="agentStageDefaults"
            data-testid="settings-agent-stage-defaults"
        />
        <div class="flex flex-col gap-1">
            <label for="wikiAlwaysTokenLimit">
                {{ 'SETTINGS.WIKI_ALWAYS_TOKEN_LIMIT' | translate }}
            </label>
            <input
                id="wikiAlwaysTokenLimit"
                uiInput
                type="number"
                min="0"
                max="60000"
                step="1000"
                formControlName="wikiAlwaysTokenLimit"
                data-testid="settings-wiki-token-limit"
            />
            <small class="ui-color-text-muted text-xs">
                {{ 'SETTINGS.WIKI_ALWAYS_TOKEN_LIMIT_HINT' | translate }}
            </small>
        </div>
    </div>
</form>
