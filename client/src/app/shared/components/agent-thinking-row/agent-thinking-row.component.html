<div class="activity-item" data-testid="agent-thinking-row">
    <div class="activity-marker">
        <app-avatar
            [disabled]="creator()?.isActive === false"
            [name]="creator()?.name ?? ''"
            [bgColor]="creator()?.colorAvatarBg ?? ''"
            [manualInitials]="$safeNavigationMigration(creator()?.avatarInitials)"
            [height]="1.875"
            [width]="1.875"
            [radius]="0.9375"
        ></app-avatar>
        <div class="connector"></div>
    </div>
    <div class="thinking-card">
        <div class="thinking-kind-row">
            <div class="kind-badge">
                <tabler-icon icon="brain" [size]="14" />
                <span>{{ 'AGENT.THINKING.LABEL' | translate }}</span>
            </div>
            @if (isTailOnly()) {
                <span class="thinking-badge" data-testid="agent-thinking-tail-badge">
                    {{ 'AGENT.THINKING.TAIL_ONLY' | translate }}
                </span>
            }
        </div>
        <button
            type="button"
            class="thinking-head"
            data-testid="agent-thinking-toggle"
            (click)="onToggle()"
        >
            <tabler-icon [icon]="isOpen() ? 'chevron-down' : 'chevron-right'" [size]="14" />
            @if (stageLabel()) {
                <span class="thinking-title">{{ stageLabel() | translate }}</span>
            }
            @if (isLive()) {
                <span class="working-dot" data-testid="agent-thinking-working"></span>
                <span>{{ 'AGENT.THINKING.WORKING' | translate }}</span>
                <span class="thinking-elapsed">{{ elapsed() }}</span>
            }
        </button>
        @if (isOpen()) {
            <app-agent-thinking-lines [lines]="lines()" [hasGap]="hasGap()" [isLive]="isLive()" />
        }
    </div>
</div>
