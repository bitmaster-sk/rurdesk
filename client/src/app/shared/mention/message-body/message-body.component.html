@for (seg of segments(); track $index) {
    @if (seg.type === 'diff') {
        <app-diff-viewer [rawPatch]="seg.content" />
    } @else if (seg.type === 'mockup') {
        <app-mockup-card
            [html]="seg.content"
            [title]="seg.title"
            [approvable]="approvable()"
            [selected]="selectedMockupRef() === seg.ref"
            [rejected]="selectedMockupRef() !== null && selectedMockupRef() !== seg.ref"
            (useAndApprove)="useMockup.emit(seg.ref)"
        />
    } @else {
        <div
            class="text-run"
            markdown
            appAttachmentRender
            [data]="seg.content"
            ngPreserveWhitespaces
            (click)="onTextClick($event)"
        ></div>
    }
}
@if (gallery.isOpen()) {
    <app-attachment-lightbox />
}
