@if (showTracker() && liveTracker(); as tracker) {
    @if (global()) {
        <div class="global-issue-link">
            @if (trackerIssue(); as issue) {
                <a [routerLink]="['/project', issue.idProject, 'issue', issue.idIssuePublic]">
                    {{ issue.title }}
                </a>
            }
        </div>
    }
    <div class="ui-input-group">
        <div class="ui-input tracker-display">{{ tracker.duration | duration }}</div>
        <div class="ui-input-group-addon">
            <ui-button
                type="button"
                size="small"
                severity="secondary"
                variant="text"
                [isIconOnly]="true"
                [ariaLabel]="'TRACK.SUBMIT' | translate"
                (click)="onSubmitTracker(tracker)"
            >
                <tabler-icon icon="check" [size]="14" />
            </ui-button>
        </div>
        <div class="ui-input-group-addon">
            <ui-button
                type="button"
                size="small"
                severity="secondary"
                variant="text"
                [isIconOnly]="true"
                [ariaLabel]="'TRACK.STOP' | translate"
                (click)="onStopTracker(tracker)"
            >
                <tabler-icon icon="x" [size]="14" />
            </ui-button>
        </div>
    </div>
} @else if (!global()) {
    <div class="ui-input-group">
        <input type="text" uiInput [formControl]="trackedControl" class="w-full" [id]="inputId()" />
        <div class="ui-input-group-addon">
            <ui-button
                [disabled]="!trackedControl.valid"
                type="button"
                size="small"
                severity="secondary"
                variant="text"
                [isIconOnly]="true"
                [ariaLabel]="'TRACK.SAVE' | translate"
                (click)="onSaveTrack()"
            >
                <tabler-icon icon="check" [size]="14" />
            </ui-button>
        </div>
        <div class="ui-input-group-addon">
            <ui-button
                type="button"
                size="small"
                severity="secondary"
                variant="text"
                [isIconOnly]="true"
                [uiTooltip]="'TRACK.START_HERE' | translate"
                uiTooltipPosition="top"
                [ariaLabel]="'TRACK.START_HERE' | translate"
                (click)="onStartRequest()"
            >
                <tabler-icon icon="clock" [size]="14" />
            </ui-button>
        </div>
    </div>

    @if (runningTracker(); as running) {
        <app-tracker-switch-dialog
            [(visible)]="isSwitchOpen"
            [tracker]="running"
            [idIssuePublic]="issue()!.idIssuePublic"
            [issueTitle]="issue()!.title"
            [projectName]="project()?.name"
            (confirmed)="onSwitchTracker()"
        ></app-tracker-switch-dialog>
    }
}
