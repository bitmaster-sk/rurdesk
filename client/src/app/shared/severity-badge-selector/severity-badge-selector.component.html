<div class="badge-selector">
    @for (sev of severities; track sev.idSeverity) {
        <button
            type="button"
            class="badge-selector__btn"
            [class.badge-selector__btn--active]="value === sev.idSeverity"
            [style.--sel-color]="sev.color"
            (click)="select(sev)"
        >
            <app-severity-badge [severity]="sev" size="xs"></app-severity-badge>
        </button>
    }
</div>
