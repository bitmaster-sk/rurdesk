<div class="form w-full" [formGroup]="form">
    <div class="form-body">
        <div class="ui-field">
            <label class="required" for="sev-title">{{ 'TITLE' | translate }}:</label>
            <input id="sev-title" uiInput formControlName="title" type="text" class="w-full" />
        </div>

        <div class="ui-field">
            <label class="required" for="sev-color">{{ 'SEVERITY.COLOR' | translate }}:</label>
            <div class="col-span-12 p-0">
                <input id="sev-color" type="color" uiColor formControlName="color" />
            </div>
        </div>
    </div>
    <div class="form-footer">
        <ui-button
            [disabled]="!form.valid"
            severity="primary"
            [label]="'SAVE' | translate"
            (click)="onSave()"
        >
            <tabler-icon icon="device-floppy" [size]="16" />
        </ui-button>
        <ui-button severity="secondary" [label]="'CANCEL' | translate" (click)="onCancel()">
            <tabler-icon icon="cancel" [size]="16" />
        </ui-button>
    </div>
</div>
