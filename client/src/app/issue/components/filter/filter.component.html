<div class="grid grid-cols-12 gap-2 w-full m-0" [formGroup]="form">
    <div class="col-span-12 grid grid-cols-12 gap-2 m-0 p-0">
        <div class="ui-field col-span-3">
            <label for="title-filter">{{ 'TITLE' | translate }}</label>
            <input id="title-filter" type="text" uiInput class="w-full" formControlName="title" />
        </div>

        <div class="ui-field col-span-3">
            <label for="create-at-filter">{{ 'ISSUE.CREATED.AT' | translate }}</label>
            <ui-date-range-select
                inputId="create-at-filter"
                formControlName="createAt"
                [presets]="createAtPresets()"
                [placeholder]="'FILTER.DATE.ANY' | translate"
            />
        </div>

        <div class="ui-field col-span-3">
            <label for="update-at-filter">{{ 'ISSUE.LAST.UPDATE.AT' | translate }}</label>
            <ui-date-range-select
                inputId="update-at-filter"
                formControlName="updateAt"
                [presets]="updateAtPresets()"
                [placeholder]="'FILTER.DATE.ANY' | translate"
            />
        </div>
    </div>

    <div class="col-span-12 grid grid-cols-12 gap-2 m-0 p-0">
        <div class="ui-field col-span-3">
            <label for="state-filter">{{ 'STATE.SINGULAR' | translate }}</label>
            <app-state-dropdown
                inputId="state-filter"
                [states]="(states$ | async) ?? []"
                [multi]="true"
                formControlName="idsState"
            ></app-state-dropdown>
            <div class="ui-field-checkbox mt-1 mb-0">
                <input
                    type="checkbox"
                    uiCheckbox
                    id="state-unset-filter"
                    [formControl]="stateUnsetControl"
                />
                <label for="state-unset-filter">
                    {{ 'ISSUE.DISPLAY.UNSET.STATES' | translate }}
                </label>
            </div>
        </div>

        <div class="ui-field col-span-3">
            <label for="severity-filter">{{ 'SEVERITY.SINGULAR' | translate }}</label>
            <app-severity-dropdown
                inputId="severity-filter"
                [severities]="(severities$ | async) ?? []"
                [multi]="true"
                formControlName="idsSeverity"
            ></app-severity-dropdown>
            <div class="ui-field-checkbox mt-1 mb-0">
                <input
                    type="checkbox"
                    uiCheckbox
                    id="severity-unset-filter"
                    [formControl]="severityUnsetControl"
                />
                <label for="severity-unset-filter">
                    {{ 'ISSUE.DISPLAY.UNSET.SEVERITIES' | translate }}
                </label>
            </div>
        </div>

        <div class="ui-field col-span-3">
            <label for="issue-type-filter">{{ 'ISSUE_TYPE.SINGULAR' | translate }}</label>
            <app-issue-type-dropdown
                inputId="issue-type-filter"
                [issueTypes]="(issueTypes$ | async) ?? []"
                [multi]="true"
                formControlName="idsIssueType"
            ></app-issue-type-dropdown>
            <div class="ui-field-checkbox mt-1 mb-0">
                <input
                    type="checkbox"
                    uiCheckbox
                    id="issue-type-unset-filter"
                    [formControl]="issueTypeUnsetControl"
                />
                <label for="issue-type-unset-filter">
                    {{ 'ISSUE.DISPLAY.UNSET.ISSUE_TYPES' | translate }}
                </label>
            </div>
        </div>

        <div class="ui-field col-span-3">
            <label for="assigned-to-filter">{{ 'ISSUE.ASSIGNED.TO' | translate }}</label>
            <app-user-dropdown
                inputId="assigned-to-filter"
                [users]="(users$ | async) ?? []"
                [multi]="true"
                formControlName="idsAssignedTo"
            ></app-user-dropdown>
            <div class="ui-field-checkbox mt-1 mb-0">
                <input
                    type="checkbox"
                    uiCheckbox
                    id="assigned-to-unset-filter"
                    [formControl]="assignedToUnsetControl"
                />
                <label for="assigned-to-unset-filter">
                    {{ 'ISSUE.DISPLAY.UNSET.ASSIGNED.TO' | translate }}
                </label>
            </div>
        </div>
    </div>
</div>
