<div class="tracked-time-chart-container" [style.height.px]="heightPx()">
    <canvas
        baseChart
        type="bar"
        [data]="chartData()"
        [options]="chartOptions()"
        [plugins]="chartPlugins"
    ></canvas>
    @if (isEmpty()) {
        <div class="chart-empty-overlay">{{ 'NO_DATA_YET' | translate }}</div>
    }
</div>
