name: E2E (nightly)

# Playwright end-to-end tests against a full production-image stack. Runs nightly
# (and on demand) rather than per-PR: it builds the tracker image and boots the
# whole stack, which is too slow to gate every push. Per-PR gating is CI (unit +
# component + backend), see ci.yml.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# cancel-in-progress stays false: a manual dispatch must not kill a nightly run
# that is already halfway through building the image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose -f docker/e2e/docker-compose.e2e.yml up -d --build

      - name: Wait for the tracker to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1000/healthz >/dev/null 2>&1; then
              echo "tracker is up"; exit 0
            fi
            echo "waiting for tracker ($i)…"; sleep 5
          done
          echo "tracker did not become healthy in time"
          docker compose -f docker/e2e/docker-compose.e2e.yml logs tracker
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # E2E_BASE_URL points Playwright at the running stack, so its config skips
      # the local (client-only) dev server.
      - name: Run e2e
        working-directory: client
        env:
          E2E_BASE_URL: http://localhost:1000
        run: npx playwright test

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

      - name: Tear down
        if: ${{ always() }}
        run: docker compose -f docker/e2e/docker-compose.e2e.yml down -v
