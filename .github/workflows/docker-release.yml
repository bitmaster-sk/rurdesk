name: Build & Push Docker Images

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: rurdesk
    OWNER: ${{ github.repository_owner }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: api/go.mod
                  cache-dependency-path: api/go.sum

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: client/package-lock.json

            - uses: ruby/setup-ruby@v1
              with:
                  ruby-version: "3.4"

            - name: Generate third-party notices
              run: |
                  gem install licensed --no-document
                  (cd api && go mod download)
                  (cd gateway && go mod download)
                  (cd client && npm ci)
                  ./script/licenses.sh

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # `latest` is applied only to stable releases. A prerelease tag
            # (e.g. v1.2.0-rc1, which contains "-") gets only its version tag.
            - name: Meta (tracker)
              id: meta-tracker
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}/rurdesk
                  tags: |
                      type=semver,pattern={{version}}
                      type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            - name: Meta (gateway-claude)
              id: meta-gateway-claude
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}/gateway-claude
                  tags: |
                      type=semver,pattern={{version}}
                      type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            - name: Meta (gateway-goose)
              id: meta-gateway-goose
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}/gateway-goose
                  tags: |
                      type=semver,pattern={{version}}
                      type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

            - name: Build & push tracker
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./docker/tracker/Dockerfile.prod
                  platforms: linux/amd64,linux/arm64
                  push: true
                  # Stamped into the Go binary so a running instance can report
                  # which release it is (admin settings → GET /api/private/admin/version).
                  build-args: |
                      VERSION=${{ steps.meta-tracker.outputs.version }}
                      COMMIT=${{ github.sha }}
                  tags: ${{ steps.meta-tracker.outputs.tags }}
                  labels: ${{ steps.meta-tracker.outputs.labels }}

            - name: Build & push gateway-claude
              uses: docker/build-push-action@v5
              with:
                  context: ./gateway
                  file: ./gateway/claude-code/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta-gateway-claude.outputs.tags }}
                  labels: ${{ steps.meta-gateway-claude.outputs.labels }}

            - name: Build & push gateway-goose
              uses: docker/build-push-action@v5
              with:
                  context: ./gateway
                  file: ./gateway/goose/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta-gateway-goose.outputs.tags }}
                  labels: ${{ steps.meta-gateway-goose.outputs.labels }}
